<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sportalsó — Admin</title>
<script src="tweetnacl.min.js"></script>
<style>
  :root { --accent:#653071; --accent-light:#b47ed4; --bg:#f6f8fa; --line:#d0d7de; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; margin:0; background:#fff; color:#1f2328; }
  header { background:var(--accent); color:#fff; padding:14px 16px; font-weight:700; font-size:18px; display:flex; justify-content:space-between; align-items:center; }
  header button { background:rgba(255,255,255,0.2); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:6px; padding:5px 12px; font-size:13px; cursor:pointer; font-weight:600; }
  main { max-width:720px; margin:0 auto; padding:16px; padding-bottom:90px; }
  section { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; background:var(--bg); }
  h2 { margin:0 0 10px; font-size:15px; }
  label { display:block; font-size:12px; color:#57606a; margin:10px 0 3px; }
  label:first-child { margin-top:0; }
  input[type=text], input[type=password], input[type=url], textarea {
    width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; font-size:15px; background:#fff;
  }
  textarea { resize:vertical; min-height:60px; font-family:inherit; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:#fff; font-size:15px; cursor:pointer; font-weight:600; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:#cf222e; border-color:#cf222e; background:#fff; }
  button.small { padding:5px 10px; font-size:13px; }
  .event { border:1px solid var(--line); border-radius:8px; padding:12px; margin-bottom:10px; background:#fff; }
  .status { position:fixed; left:0; right:0; bottom:0; background:#1f2328; color:#fff;
    padding:12px 16px; font-size:14px; min-height:48px; display:flex; align-items:center; gap:10px; z-index:999; }
  .ok { color:#7ee787; } .err { color:#ffa198; }
  .muted { color:#57606a; font-size:12px; }
  .img-preview { width:100%; max-height:200px; object-fit:cover; border-radius:6px; border:1px solid var(--line); margin-top:6px; display:none; }
  .img-row { display:flex; gap:8px; align-items:flex-end; }
  .img-row .img-col { flex:1; }
  .img-row .img-thumb { width:120px; height:80px; object-fit:cover; border-radius:6px; border:1px solid var(--line); flex-shrink:0; display:none; }
  .compress-info { font-size:11px; color:#57606a; margin-top:2px; }

  /* login */
  .login-wrap { max-width:380px; margin:60px auto 0; }
  .login-wrap section { padding:24px; }
  .login-wrap h2 { font-size:20px; text-align:center; margin-bottom:16px; }
  .login-err { background:#ffebe9; border:1px solid #ff818266; color:#cf222e; border-radius:8px; padding:10px 14px; font-size:14px; margin-bottom:12px; display:none; }
  .login-wrap button.primary { width:100%; padding:12px; font-size:16px; margin-top:12px; }

  /* dashboard tiles */
  .tiles { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:14px; }
  .tile {
    border:1px solid var(--line); border-radius:12px; padding:20px 16px; background:var(--bg);
    cursor:pointer; text-align:center; transition:box-shadow .15s, border-color .15s;
  }
  .tile:hover { border-color:var(--accent-light); box-shadow:0 2px 12px rgba(101,48,113,.15); }
  .tile-icon { font-size:32px; margin-bottom:8px; }
  .tile-title { font-size:15px; font-weight:700; }
  .tile-desc { font-size:12px; color:#57606a; margin-top:4px; }
  .tile.disabled { opacity:.4; cursor:default; pointer-events:none; }

  /* sub-page header */
  .sub-header { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .sub-header .back { background:none; border:none; font-size:22px; cursor:pointer; padding:0 4px; color:var(--accent); font-weight:700; }
  .sub-header h2 { margin:0; font-size:18px; }
</style>
</head>
<body>
<header>
  <span>Sportalsó — admin</span>
  <button id="logoutBtn" style="display:none">Kijelentkezés</button>
</header>
<main>

  <!-- LOGIN -->
  <div id="loginScreen" class="login-wrap">
    <section>
      <h2>Bejelentkezés</h2>
      <div class="login-err" id="loginErr"></div>
      <label>GitHub repo</label>
      <input type="text" id="repo" placeholder="Nandor116/sportalso" autocomplete="off">
      <label>GitHub token (Contents: Read+Write)</label>
      <input type="password" id="token" placeholder="github_pat_..." autocomplete="off">
      <label>Titkos kulcs (HEX)</label>
      <input type="file" id="keyfile" accept=".key,.txt" style="margin-top:4px">
      <textarea id="keyhex" rows="2" placeholder="128 hex karakter..." style="width:100%;font-family:monospace;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:8px"></textarea>
      <label style="display:flex;gap:6px;align-items:center;margin-top:10px">
        <input type="checkbox" id="remember"> Megjegyzés ezen a készüléken
      </label>
      <button class="primary" id="loginBtn">Belépés</button>
    </section>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" style="display:none">
    <div class="tiles">
      <div class="tile" id="tileEvents">
        <div class="tile-icon">{"\uD83D\uDCC5"}</div>
        <div class="tile-title">Események</div>
        <div class="tile-desc" id="tileEventsDesc">Koncertek kezelése</div>
      </div>
      <div class="tile disabled">
        <div class="tile-icon">{"\u2699\uFE0F"}</div>
        <div class="tile-title">Beállítások</div>
        <div class="tile-desc">Hamarosan</div>
      </div>
      <div class="tile disabled">
        <div class="tile-icon">{"\uD83D\uDCCA"}</div>
        <div class="tile-title">Statisztika</div>
        <div class="tile-desc">Hamarosan</div>
      </div>
      <div class="tile disabled">
        <div class="tile-icon">{"\uD83D\uDCE8"}</div>
        <div class="tile-title">Értesítések</div>
        <div class="tile-desc">Hamarosan</div>
      </div>
    </div>
  </div>

  <!-- EVENT EDITOR -->
  <div id="editorView" style="display:none">
    <div class="sub-header">
      <button class="back" id="backBtn">{"\u2190"}</button>
      <h2>Események</h2>
    </div>
    <section>
      <div id="events"></div>
      <button class="small" id="addEvent">+ Új esemény</button>
    </section>
    <div class="row">
      <button class="primary" id="publish">Publikálás</button>
      <button id="download">Letöltés</button>
      <button id="reload">Frissítés</button>
    </div>
    <p class="muted" id="serverInfo"></p>
  </div>

</main>
<div class="status"><span id="statusText">Kész.</span></div>

<script>
const $ = id => document.getElementById(id);
let events = [];
let serverVersion = 0;
let currentRepo = "";
let currentBranch = "main";
let currentPath = "events.json";

function setStatus(msg, cls) {
  $("statusText").textContent = msg;
  $("statusText").className = cls || "";
}

function showLoginErr(msg) {
  const el = $("loginErr");
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";
}

// ---------- navigation ----------
function showView(view) {
  $("loginScreen").style.display = "none";
  $("dashboard").style.display = "none";
  $("editorView").style.display = "none";
  $("logoutBtn").style.display = "none";
  if (view === "login") $("loginScreen").style.display = "";
  if (view === "dashboard") { $("dashboard").style.display = ""; $("logoutBtn").style.display = ""; }
  if (view === "editor") { $("editorView").style.display = ""; $("logoutBtn").style.display = ""; }
}

// ---------- persistence ----------
function saveCreds(remember) {
  const data = {
    repo: $("repo").value.trim(),
    branch: currentBranch,
    path: currentPath,
    token: $("token").value.trim(),
    keyhex: $("keyhex").value.trim(),
    remember
  };
  if (remember) localStorage.setItem("sportalso_creds", JSON.stringify(data));
  else localStorage.removeItem("sportalso_creds");
}

function loadCreds() {
  try {
    const s = JSON.parse(localStorage.getItem("sportalso_creds") || "{}");
    if (s.repo) $("repo").value = s.repo;
    if (s.token) $("token").value = s.token;
    if (s.keyhex) $("keyhex").value = s.keyhex;
    if (s.remember) $("remember").checked = true;
    return s;
  } catch { return {}; }
}

// ---------- key validation ----------
function validateKey() {
  const keyhex = $("keyhex").value.trim();
  if (!/^[0-9a-fA-F]{128}$/.test(keyhex)) return false;
  const secret = new Uint8Array(keyhex.match(/.{2}/g).map(h => parseInt(h, 16)));
  const pubHex = Array.from(nacl.sign.keyPair.fromSecretKey(secret).publicKey)
    .map(b => b.toString(16).padStart(2, "0")).join("");
  return pubHex === (window.SPORTALSO_PUBLIC_KEY || "").toLowerCase();
}

// ---------- login ----------
$("keyfile").addEventListener("change", e => {
  const f = e.target.files[0];
  if (!f) return;
  f.text().then(t => { $("keyhex").value = t.trim(); });
});

async function doLogin() {
  showLoginErr("");
  const repo = $("repo").value.trim();
  const token = $("token").value.trim();
  const keyhex = $("keyhex").value.trim();

  if (!repo) { showLoginErr("Add meg a repo nevét!"); return; }
  if (!token) { showLoginErr("Add meg a GitHub token-t!"); return; }
  if (!validateKey()) { showLoginErr("A kulcs nem érvényes (nem egyezik a nyilvános kulccsal)."); return; }

  setStatus("Bejelentkezés...");
  try {
    const r = await fetch(`https://api.github.com/repos/${repo}/contents/events.json`, {
      headers: { Authorization: `Bearer ${token}` }
    });
    if (r.status === 401) { showLoginErr("Hibás token vagy nincs jogosultság (401)."); setStatus("Sikertelen belépés.", "err"); return; }
    if (r.status === 404 || r.ok) {
      currentRepo = repo; currentBranch = "main"; currentPath = "events.json";
    } else {
      showLoginErr(`GitHub hiba: ${r.status}`); setStatus("Sikertelen belépés.", "err"); return;
    }
  } catch (e) {
    showLoginErr("Hálózati hiba: " + e.message); setStatus("Sikertelen belépés.", "err"); return;
  }

  saveCreds($("remember").checked);
  enterDashboard();
}

$("loginBtn").onclick = doLogin;
$("keyhex").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
$("token").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });

function enterDashboard() {
  showView("dashboard");
  setStatus("Belépve.", "ok");
  void loadDashboardData();
}

async function loadDashboardData() {
  try {
    const { path } = cfg();
    const meta = await ghGet(path);
    if (meta) {
      const jsonText = atob(meta.content.replace(/\n/g, ""));
      const data = JSON.parse(jsonText);
      const count = (data.events || []).length;
      $("tileEventsDesc").textContent = `${count} esemény`;
    } else {
      $("tileEventsDesc").textContent = "Még nincs esemény";
    }
  } catch { $("tileEventsDesc").textContent = "Koncertek kezelése"; }
}

function doLogout() {
  localStorage.removeItem("sportalso_creds");
  events = []; serverVersion = 0;
  $("keyhex").value = ""; $("token").value = "";
  $("serverInfo").textContent = "";
  showLoginErr("");
  showView("login");
  setStatus("Kijelentkezve.", "");
}
$("logoutBtn").onclick = doLogout;

// ---------- dashboard -> editor ----------
$("tileEvents").onclick = () => {
  showView("editor");
  void fetchFromServer();
};
$("backBtn").onclick = () => {
  showView("dashboard");
  void loadDashboardData();
};

// ---------- github api ----------
function cfg() {
  return { repo: currentRepo, branch: currentBranch, path: currentPath, token: $("token").value.trim(), keyhex: $("keyhex").value.trim() };
}

async function ghGet(path) {
  const { repo, branch, token } = cfg();
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}?ref=${branch}`, {
    headers: token ? { Authorization: `Bearer ${token}` } : {}
  });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(`GitHub GET ${path}: ${r.status}`);
  return r.json();
}
async function ghPut(path, content, sha, message) {
  const { repo, branch, token } = cfg();
  const r = await fetch(`https://api.github.com/repos/${repo}/contents/${path}`, {
    method: "PUT",
    headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
    body: JSON.stringify({ message, branch, sha, content })
  });
  if (!r.ok) throw new Error(`GitHub PUT ${path}: ${r.status} ${await r.text()}`);
  return r.json();
}

// ---------- image compression ----------
function compressImage(file, maxW, maxH, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Nem sikerült betölteni a képet."));
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = h * maxW / w; w = maxW; }
        if (h > maxH) { w = w * maxH / h; h = maxH; }
        w = Math.round(w); h = Math.round(h);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = quality;
        function tryCompress() {
          canvas.toBlob(b => {
            if (b.size > 500000 && q > 0.3) { q -= 0.1; tryCompress(); }
            else resolve({ blob: b, width: w, height: h });
          }, "image/jpeg", q);
        }
        tryCompress();
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function blobToBase64(blob) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.readAsDataURL(blob);
  });
}

// ---------- event editor ----------
function newEvent() {
  const d = new Date(Date.now() + 7 * 86400000);
  d.setHours(20, 0, 0, 0);
  const pad = n => String(n).padStart(2, "0");
  return {
    id: Array.from(nacl.randomBytes(4)).map(b => b.toString(16).padStart(2, "0")).join("").slice(0, 6),
    title: "",
    startsAtLocal: `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`,
    ticketUrl: "", note: "", description: "", imageUrl: "",
    _imageBase64: null, _imageFileName: ""
  };
}

function render() {
  const box = $("events");
  box.innerHTML = "";
  if (!events.length) box.innerHTML = '<p class="muted">Még nincs esemény. Kattints a "+ Új esemény" gombra.</p>';
  events.forEach((ev, i) => {
    const div = document.createElement("div");
    div.className = "event";
    div.innerHTML = `
      <div class="row">
        <div><label>Cím</label><input type="text" data-f="title" value=""></div>
      </div>
      <div class="row">
        <div><label>Dátum</label><input type="date" data-f="startDate" value=""></div>
        <div style="max-width:120px"><label>Idő</label><input type="time" data-f="startTime" value=""></div>
      </div>
      <div class="row">
        <div><label>Jegylink</label><input type="url" data-f="ticketUrl" placeholder="https://..."></div>
        <div><label>Megjegyzés</label><input type="text" data-f="note"></div>
      </div>
      <label>Leírás</label>
      <textarea data-f="description" placeholder="Rövid leírás..."></textarea>
      <div class="img-row">
        <div class="img-col">
          <label>Borítókép</label>
          <input type="file" accept="image/*" data-img="${i}">
          <div class="compress-info" data-compressinfo="${i}"></div>
        </div>
        <img class="img-thumb" data-imgthumb="${i}">
      </div>
      ${ev.imageUrl ? `<img class="img-preview" data-imgpreview="${i}" src="${ev.imageUrl}">` : ""}
      <div style="text-align:right;margin-top:6px">
        <span class="muted">id: ${ev.id}</span>
        <button class="danger small" data-del="${i}">Törlés</button>
      </div>`;
    div.querySelector("[data-f=title]").value = ev.title;
    const parts = (ev.startsAtLocal || "").split("T");
    div.querySelector("[data-f=startDate]").value = parts[0] || "";
    div.querySelector("[data-f=startTime]").value = parts[1] || "";

    div.querySelectorAll("[data-f]").forEach(inp => {
      const field = inp.dataset.f;
      inp.addEventListener("input", () => {
        if (field === "startDate" || field === "startTime") {
          const dateVal = div.querySelector("[data-f=startDate]").value;
          const timeVal = div.querySelector("[data-f=startTime]").value;
          ev.startsAtLocal = dateVal && timeVal ? `${dateVal}T${timeVal}` : dateVal || "";
        } else {
          ev[field] = inp.value;
        }
      });
    });
    div.querySelector("[data-del]").onclick = () => { events.splice(i, 1); render(); };

    const imgInput = div.querySelector(`[data-img="${i}"]`);
    const thumb = div.querySelector(`[data-imgthumb="${i}"]`);
    const compressInfo = div.querySelector(`[data-compressinfo="${i}"]`);
    const preview = div.querySelector(`[data-imgpreview="${i}"]`);
    if (ev.imageUrl && preview) preview.style.display = "block";

    imgInput.addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        compressInfo.textContent = "Tömörítés...";
        const { blob, width, height } = await compressImage(file, 1200, 900, 0.85);
        const b64 = await blobToBase64(blob);
        ev._imageBase64 = b64;
        ev._imageFileName = `${ev.id}.${(file.name.split(".").pop() || "jpg")}`;
        compressInfo.textContent = `Kész: ${width}\u00d7${height}px, ${Math.round(blob.size / 1024)} KB`;
        thumb.src = URL.createObjectURL(blob);
        thumb.style.display = "block";
      } catch (err) { compressInfo.textContent = "Hiba: " + err.message; }
    });
    box.appendChild(div);
  });
}
$("addEvent").onclick = () => { events.push(newEvent()); render(); };

// ---------- serialization & signing ----------
function buildPayload() {
  const clean = events
    .filter(e => e.title.trim())
    .sort((a, b) => new Date(a.startsAtLocal) - new Date(b.startsAtLocal))
    .map(e => ({
      id: e.id, title: e.title.trim(), startsAt: new Date(e.startsAtLocal).toISOString(),
      ...(e.imageUrl ? { imageUrl: e.imageUrl } : {}),
      ...(e.description.trim() ? { description: e.description.trim() } : {}),
      ...(e.ticketUrl.trim() ? { ticketUrl: e.ticketUrl.trim() } : {}),
      ...(e.note.trim() ? { note: e.note.trim() } : {})
    }));
  return JSON.stringify({ version: serverVersion + 1, generatedAt: new Date().toISOString(), events: clean }, null, 2) + "\n";
}

async function sign(jsonText) {
  const { keyhex } = cfg();
  if (!/^[0-9a-fA-F]{128}$/.test(keyhex)) throw new Error("Érvénytelen kulcs.");
  const secret = new Uint8Array(keyhex.match(/.{2}/g).map(h => parseInt(h, 16)));
  const sig = nacl.sign.detached(new TextEncoder().encode(jsonText), secret);
  return btoa(String.fromCharCode(...sig));
}

// ---------- load from server ----------
async function fetchFromServer() {
  const { path } = cfg();
  const meta = await ghGet(path);
  if (!meta) {
    events = []; serverVersion = 0;
    $("serverInfo").textContent = "Még nincs events.json \u2014 az első publikálás létrehozza.";
    render(); return;
  }
  const jsonText = atob(meta.content.replace(/\n/g, ""));
  const sigMeta = await ghGet(path.replace(/\.json$/, ".sig"));
  let verified = false;
  try {
    const pubHex = window.SPORTALSO_PUBLIC_KEY || "";
    if (sigMeta && /^[0-9a-fA-F]{64}$/.test(pubHex)) {
      const pub = new Uint8Array(pubHex.match(/.{2}/g).map(h => parseInt(h, 16)));
      const sig = Uint8Array.from(atob(atob(sigMeta.content.replace(/\n/g, ""))), c => c.charCodeAt(0));
      verified = nacl.sign.detached.verify(new TextEncoder().encode(jsonText), sig, pub);
    }
  } catch (_) {}
  const data = JSON.parse(jsonText);
  serverVersion = data.version || 0;
  events = (data.events || []).map(e => ({
    ...e,
    startsAtLocal: new Date(e.startsAt).toLocaleString("sv-SE", { timeZone: "Europe/Budapest" }).slice(0, 16)
  }));
  $("serverInfo").textContent =
    `Szerver: v${serverVersion}, ${events.length} esemény` + (verified ? " \u2022 aláírás \u2713" : "");
  render();
}

// ---------- actions ----------
$("reload").onclick = async () => {
  try { await fetchFromServer(); setStatus("Frissítve.", "ok"); }
  catch (e) { setStatus("Hiba: " + e.message, "err"); }
};

async function uploadImage(ev) {
  if (!ev._imageBase64) return;
  const imgPath = `images/${ev._imageFileName}`;
  const existing = await ghGet(imgPath);
  await ghPut(imgPath, ev._imageBase64, existing ? existing.sha : undefined, `Kép: ${ev.title || ev.id}`);
  ev.imageUrl = `https://nandor116.github.io/sportalso/${imgPath}`;
  ev._imageBase64 = null;
}

$("publish").onclick = async () => {
  try {
    const { token } = cfg();
    if (!token) throw new Error("Token hiányzik.");
    setStatus("Képek feltöltése...");
    for (const ev of events) { if (ev._imageBase64) await uploadImage(ev); }
    const json = buildPayload();
    const sig = await sign(json);
    setStatus("Publikálás...");
    const metaJson = await ghGet(cfg().path);
    const sigPath = cfg().path.replace(/\.json$/, ".sig");
    const metaSig = await ghGet(sigPath);
    await ghPut(cfg().path, btoa(unescape(encodeURIComponent(json))), metaJson?.sha, `v${serverVersion + 1}`);
    await ghPut(sigPath, btoa(sig + "\n"), metaSig?.sha, `Aláírás v${serverVersion + 1}`);
    serverVersion += 1;
    setStatus("Kész! \u2713", "ok");
    await fetchFromServer();
  } catch (e) { setStatus("Hiba: " + e.message, "err"); }
};

$("download").onclick = async () => {
  try {
    const json = buildPayload();
    const sig = await sign(json);
    const dl = (name, content) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([content], { type: "text/plain" }));
      a.download = name; a.click();
    };
    dl("events.json", json);
    setTimeout(() => dl("events.sig", sig + "\n"), 400);
    setStatus("Két fájl letöltve.", "ok");
  } catch (e) { setStatus("Hiba: " + e.message, "err"); }
};

// ---------- boot ----------
(function boot() {
  const creds = loadCreds();
  if (creds.repo && creds.token && creds.keyhex && validateKey()) {
    currentRepo = creds.repo;
    currentBranch = creds.branch || "main";
    currentPath = creds.path || "events.json";
    enterDashboard();
  } else {
    showView("login");
  }
  setStatus("Kész.");
})();
</script>
